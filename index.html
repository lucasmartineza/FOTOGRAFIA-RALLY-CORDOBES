<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rally Cordobés - Galería</title>
<style>
  :root {
    --bg: #0a0a0a;
    --lima: #c6ff00;
    --blanco: #f4f4f4;
    --gris: #1a1a1a;
    --gris-borde: #2a2a2a;
    --alto-franja: 128px;
  }
  @media (max-width: 600px) {
    :root { --alto-franja: 96px; }
  }
  * { box-sizing: border-box; }
  .fondo-textura {
    position: fixed;
    inset: 0;
    background-image: url('assets/fondo-textura.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.06;
    z-index: -1;
    pointer-events: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--blanco);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: var(--alto-franja);
  }
  header {
    padding: 20px 20px 14px;
    text-align: center;
    border-bottom: 1px solid var(--gris-borde);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 50;
  }
  header .logo {
    max-width: 260px;
    width: 60%;
    height: auto;
    display: block;
    margin: 0 auto 8px;
  }
  header p.tagline {
    margin: 0;
    color: var(--lima);
    font-size: 0.8rem;
    letter-spacing: 2px;
    font-weight: bold;
  }
  .fila-volver {
    display: flex;
    justify-content: center;
    padding: 14px 20px 4px;
  }
  .btn-volver {
    background: var(--gris);
    border: 2px solid var(--lima);
    color: var(--lima);
    border-radius: 999px;
    padding: 10px 28px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn-volver:hover { background: var(--lima); color: #000; }
  .btn-volver.oculto { display: none; }
  .breadcrumb {
    padding: 8px 20px 4px;
    font-size: 0.85rem;
    color: #999;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    align-items: center;
  }
  .breadcrumb span.crumb {
    cursor: pointer;
    color: var(--lima);
  }
  .breadcrumb span.crumb:hover { text-decoration: underline; }
  .breadcrumb span.sep { color: #555; }

  #contenido { padding: 8px 20px 60px; }

  .botonera {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
  }
  .boton-carpeta {
    background: var(--gris);
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    padding: 18px 14px;
    color: var(--blanco);
    text-align: center;
    cursor: pointer;
    font-size: 0.95rem;
    transition: border-color .15s, transform .15s;
    flex: 0 1 160px;
    max-width: 200px;
  }
  .boton-carpeta:hover {
    border-color: var(--lima);
    transform: translateY(-2px);
  }

  .vacio {
    color: #777;
    padding: 40px 0;
    text-align: center;
    font-size: 0.95rem;
  }

  .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .foto-card {
    position: relative;
    background: var(--gris);
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
  }
  .foto-card.seleccionada { border-color: var(--lima); }
  .foto-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }
  .foto-check {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 22px;
    height: 22px;
    accent-color: var(--lima);
  }
  .foto-acciones {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    font-size: 0.75rem;
  }
  .foto-acciones a {
    color: var(--lima);
    text-decoration: none;
  }

  .barra-seleccion {
    position: fixed;
    bottom: var(--alto-franja); left: 0; right: 0;
    background: var(--gris);
    border-top: 1px solid var(--lima);
    padding: 12px 20px;
    display: none;
    justify-content: space-between;
    align-items: center;
    z-index: 90;
  }
  .barra-seleccion.activa { display: flex; }
  .btn-lima {
    background: var(--lima);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-lima:disabled { opacity: 0.5; cursor: default; }

  .boton-carpeta.en-vivo {
    border-color: var(--lima);
    position: relative;
    animation: pulso-glow 1.8s ease-in-out infinite;
  }
  .boton-carpeta.en-vivo .badge-vivo {
    display: inline-block;
    margin-bottom: 4px;
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: var(--lima);
    font-weight: bold;
  }
  .boton-carpeta.en-vivo .badge-vivo::before {
    content: '●';
    margin-right: 4px;
    animation: parpadeo 1.2s infinite;
  }
  @keyframes pulso-glow {
    0%, 100% { box-shadow: 0 0 6px 1px rgba(198,255,0,0.5); }
    50% { box-shadow: 0 0 22px 6px rgba(198,255,0,0.85); }
  }
  @keyframes parpadeo {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ===== LIGHTBOX ===== */
  .lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  .lightbox-overlay.activo { display: flex; }
  .lightbox-overlay img {
    max-width: 92vw;
    max-height: 72vh;
    object-fit: contain;
    border-radius: 6px;
    transition: filter .25s ease;
  }
  .lightbox-overlay img.cargando-hd {
    filter: blur(2px) brightness(0.92);
  }
  .lightbox-credito {
    color: #aaa;
    font-size: 0.8rem;
    margin-top: 10px;
    text-align: center;
  }
  .lightbox-credito span { color: var(--lima); }
  .lightbox-acciones {
    display: flex;
    gap: 12px;
    margin-top: 14px;
  }
  .btn-cerrar-lightbox {
    background: transparent;
    border: 1px solid var(--gris-borde);
    color: var(--blanco);
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn-cerrar-lightbox:hover { border-color: var(--lima); }

  .lightbox-flecha {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(26,26,26,0.75);
    border: 1px solid var(--gris-borde);
    color: var(--lima);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    z-index: 210;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-flecha:hover { border-color: var(--lima); }
  .lightbox-flecha:disabled { opacity: 0.25; cursor: default; }
  .lightbox-flecha.izquierda { left: 10px; }
  .lightbox-flecha.derecha { right: 10px; }
  @media (max-width: 600px) {
    .lightbox-flecha { width: 40px; height: 40px; font-size: 1.2rem; }
  }

  footer.contacto {
    padding: 20px;
    text-align: center;
    color: #888;
    font-size: 0.8rem;
    border-top: 1px solid var(--gris-borde);
  }
  footer.contacto a { color: var(--lima); }

  /* ===== FRANJA DE SPONSORS (autoroll) ===== */
  .franja-sponsors {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--alto-franja);
    background: #ffffff;
    border-top: 1px solid #e2e2e2;
    overflow: hidden;
    z-index: 80;
    display: flex;
    align-items: center;
  }
  .franja-sponsors .track {
    display: flex;
    align-items: center;
    gap: 64px;
    white-space: nowrap;
    padding-left: 64px;
    animation: desplazar-sponsors 28s linear infinite;
    will-change: transform;
  }
  .franja-sponsors:hover .track {
    animation-play-state: paused;
  }
  .franja-sponsors .track img {
    height: 80px;
    width: 320px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 1;
  }
  @media (max-width: 600px) {
    .franja-sponsors .track img { height: 56px; width: 224px; }
    .franja-sponsors .track { gap: 40px; padding-left: 40px; animation-duration: 20s; }
  }
  @keyframes desplazar-sponsors {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
</style>
</head>

</header>

<div class="fila-volver">
  <button class="btn-volver" id="btnVolver">← Volver</button>
</div>
<div class="breadcrumb" id="breadcrumb"></div>

<div id="contenido">
  <div class="vacio" id="cargando">Cargando...</div>
</div>

<div class="barra-seleccion" id="barraSeleccion">
  <span id="contadorSeleccion">0 seleccionadas</span>
  <button class="btn-lima" id="btnDescargarZip">Descargar selección (.zip)</button>
</div>

<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-flecha izquierda" id="btnFlechaAnterior" aria-label="Foto anterior">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-flecha derecha" id="btnFlechaSiguiente" aria-label="Foto siguiente">›</button>
  <div class="lightbox-credito" id="lightboxCredito"></div>
  <div class="lightbox-acciones">
    <a class="btn-lima" id="lightboxDescargar" href="#" target="_blank" style="text-decoration:none;">Descargar</a>
    <button class="btn-cerrar-lightbox" id="btnCerrarLightbox">Cerrar</button>
  </div>
</div>

<div class="franja-sponsors" id="franjaSponsors">
  <div class="track" id="trackSponsors"></div>
</div>

<script>
// ======= CONFIGURACIÓN =======
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzNyACKmpiYiVgIhKw-twzN5bM1xXgAmHhynXbx6rjcXobVRANouN7AfHzuQjzkzc5Y/exec';
const ROOT_FOLDER_ID = '1ADqvynC4y9OEBF3vm7CqSr31KI9WEKkA';

// ======= SPONSORS (franja inferior con autoroll) =======
// Reemplazá "logoUrl" por la ruta real una vez que subas los logos a una
// carpeta "sponsors/" en el mismo repo de GitHub (ej: 'sponsors/sponsor-michelin.png').
// "link" es opcional: si lo completás, el logo es clickeable y abre esa web.
const SPONSORS = [
  { nombre: 'AMP', logoUrl: 'sponsors/ok%20amp.png', link: '' },
  { nombre: 'Cadena 3', logoUrl: 'sponsors/ok%20cadena3.png', link: '' },
  { nombre: 'CBA', logoUrl: 'sponsors/ok%20cba.png', link: '' },
  { nombre: 'Iveco', logoUrl: 'sponsors/ok%20iveco.png', link: '' },
  { nombre: 'Larrosa', logoUrl: 'sponsors/ok%20larrosa.png', link: '' },
  { nombre: 'Lusqtoff', logoUrl: 'sponsors/ok%20lusqtoff.png', link: '' },
  { nombre: 'Midea', logoUrl: 'sponsors/ok%20midea.png', link: '' },
  { nombre: 'Motor Total', logoUrl: 'sponsors/ok%20motor%20total.png', link: '' },
  { nombre: 'Pirelli', logoUrl: 'sponsors/ok%20pirelli.png', link: '' },
  { nombre: 'Rumipal', logoUrl: 'sponsors/ok%20rumipal.png', link: '' },
  { nombre: 'RUS', logoUrl: 'sponsors/ok%20rus.png', link: '' },
  { nombre: 'Vittal', logoUrl: 'sponsors/ok%20vittal.png', link: '' },
  { nombre: 'Workia', logoUrl: 'sponsors/ok%20workia.png', link: '' },
];

function renderizarSponsors() {
  const track = document.getElementById('trackSponsors');
  if (!SPONSORS.length) {
    document.getElementById('franjaSponsors').style.display = 'none';
    document.body.style.paddingBottom = '0';
    return;
  }

  // duplicamos la lista para que el loop sea perfectamente continuo (translateX -50%)
  const listaDoble = SPONSORS.concat(SPONSORS);

  track.innerHTML = '';
  listaDoble.forEach(s => {
    const img = document.createElement('img');
    img.src = s.logoUrl;
    img.alt = s.nombre;
    if (s.link) {
      const a = document.createElement('a');
      a.href = s.link;
      a.target = '_blank';
      a.appendChild(img);
      track.appendChild(a);
    } else {
      track.appendChild(img);
    }
  });
}
renderizarSponsors();

// ======= ESTADO =======
let pila = [{ id: ROOT_FOLDER_ID, nombre: 'Carreras' }]; // breadcrumb stack
let seleccionadas = new Set();
let enGaleria = false;
let fotosGaleria = []; // todas las fotos cargadas hasta ahora de la carpeta actual
let carpetaGaleriaActualId = null;
let indiceLightboxActual = -1;

// ======= NAVEGACIÓN =======
async function cargarNivel(folderId) {
  enGaleria = false;
  seleccionadas.clear();
  actualizarBarraSeleccion();

  const contenido = document.getElementById('contenido');
  contenido.innerHTML = '<div class="vacio">Cargando...</div>';

  const res = await fetch(`${BACKEND_URL}?action=listar&folderId=${folderId}`);
  const data = await res.json();

  if (data.error) {
    contenido.innerHTML = `<div class="vacio">Error: ${data.error}</div>`;
    return;
  }

  if (data.vacio) {
    contenido.innerHTML = '<div class="vacio">Sin material disponible en esta sección todavía.</div>';
    return;
  }

  if (data.subcarpetas.length === 0) {
    // No hay subcarpetas pero sí hay archivos -> es el nivel de galería
    cargarGaleria(folderId);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'botonera';
  const esNivelCarreras = folderId === ROOT_FOLDER_ID;
  data.subcarpetas.forEach((c, i) => {
    const btn = document.createElement('div');
    btn.className = 'boton-carpeta';

    const esUltima = esNivelCarreras && i === data.subcarpetas.length - 1;
    if (esUltima) {
      btn.classList.add('en-vivo');
      const badge = document.createElement('div');
      badge.className = 'badge-vivo';
      badge.textContent = 'EN VIVO';
      btn.appendChild(badge);
    }

    const nombreSpan = document.createElement('div');
    nombreSpan.textContent = c.nombre;
    btn.appendChild(nombreSpan);

    btn.onclick = () => {
      pila.push({ id: c.id, nombre: c.nombre });
      renderBreadcrumb();
      cargarNivel(c.id);
    };
    grid.appendChild(btn);
  });
  contenido.innerHTML = '';
  contenido.appendChild(grid);
}

let paginaActualToken = null;
let cargandoMas = false;

async function cargarGaleria(folderId, pageToken) {
  enGaleria = true;
  carpetaGaleriaActualId = folderId;
  const contenido = document.getElementById('contenido');

  if (!pageToken) {
    // primera carga de esta carpeta: limpiamos todo
    contenido.innerHTML = '<div class="vacio">Cargando fotos...</div>';
    fotosGaleria = [];
  }

  let url = `${BACKEND_URL}?action=fotos&folderId=${folderId}`;
  if (pageToken) url += `&pageToken=${encodeURIComponent(pageToken)}`;

  const res = await fetch(url);
  const data = await res.json();

  if (data.error) {
    contenido.innerHTML = `<div class="vacio">Error: ${data.error}</div>`;
    return;
  }

  if (data.vacio) {
    contenido.innerHTML = '<div class="vacio">Sin fotos en esta sección todavía.</div>';
    return;
  }

  let grid = contenido.querySelector('.galeria');
  if (!grid) {
    contenido.innerHTML = '';
    grid = document.createElement('div');
    grid.className = 'galeria';
    contenido.appendChild(grid);
  }

  const inicioIndice = fotosGaleria.length;
  fotosGaleria.push(...data.archivos);

  data.archivos.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'foto-card';
    card.dataset.id = f.id;

    const indiceFoto = inicioIndice + i;

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'foto-check';
    check.onclick = (e) => {
      e.stopPropagation();
      toggleSeleccion(f.id, card);
    };

    const img = document.createElement('img');
    img.src = f.thumbnailUrl;
    img.loading = 'lazy';
    img.onclick = () => abrirLightbox(indiceFoto);

    const acciones = document.createElement('div');
    acciones.className = 'foto-acciones';
    acciones.innerHTML = `
      <a href="${f.descargaUrl}" target="_blank">Descargar</a>
      <a href="#" onclick="copiarLink('${f.descargaUrl}'); return false;">Copiar link</a>
    `;

    card.appendChild(check);
    card.appendChild(img);
    card.appendChild(acciones);
    grid.appendChild(card);
  });

  // sacamos el botón "cargar más" viejo si había, y ponemos uno nuevo si corresponde
  const botonViejo = contenido.querySelector('.btn-cargar-mas');
  if (botonViejo) botonViejo.remove();

  paginaActualToken = data.siguientePagina;

  if (paginaActualToken) {
    const btnMas = document.createElement('button');
    btnMas.className = 'btn-lima btn-cargar-mas';
    btnMas.textContent = 'Cargar más fotos';
    btnMas.style.display = 'block';
    btnMas.style.margin = '16px auto 40px';
    btnMas.onclick = () => {
      if (cargandoMas) return;
      cargandoMas = true;
      btnMas.textContent = 'Cargando...';
      btnMas.disabled = true;
      cargarGaleria(folderId, paginaActualToken).then(() => { cargandoMas = false; });
    };
    contenido.appendChild(btnMas);
  }
}

function toggleSeleccion(id, card) {
  if (seleccionadas.has(id)) {
    seleccionadas.delete(id);
    card.classList.remove('seleccionada');
    card.querySelector('.foto-check').checked = false;
  } else {
    seleccionadas.add(id);
    card.classList.add('seleccionada');
    card.querySelector('.foto-check').checked = true;
  }
  actualizarBarraSeleccion();
}

function actualizarBarraSeleccion() {
  const barra = document.getElementById('barraSeleccion');
  const contador = document.getElementById('contadorSeleccion');
  if (seleccionadas.size > 0) {
    barra.classList.add('activa');
    contador.textContent = `${seleccionadas.size} seleccionada${seleccionadas.size > 1 ? 's' : ''}`;
  } else {
    barra.classList.remove('activa');
  }
}

function copiarLink(url) {
  navigator.clipboard.writeText(url);
  alert('Link copiado');
}

document.getElementById('btnDescargarZip').onclick = async () => {
  if (seleccionadas.size === 0) return;
  const btn = document.getElementById('btnDescargarZip');
  btn.disabled = true;
  btn.textContent = 'Preparando zip...';

  const res = await fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'zip',
      fileIds: Array.from(seleccionadas),
      nombreZip: 'RallyCordobes'
    })
  });
  const data = await res.json();

  btn.disabled = false;
  btn.textContent = 'Descargar selección (.zip)';

  if (data.error) {
    alert('Error al generar el zip: ' + data.error);
    return;
  }
  window.open(data.descargaUrl, '_blank');
};

function nombreFotografoActual() {
  // El fotógrafo es la carpeta un nivel arriba de Delantera/Integrales
  if (pila.length >= 2) {
    return pila[pila.length - 2].nombre;
  }
  return pila[pila.length - 1]?.nombre || '';
}

function abrirLightbox(indice) {
  if (indice < 0 || indice >= fotosGaleria.length) return;
  indiceLightboxActual = indice;
  const f = fotosGaleria[indice];

  const overlay = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  const credito = document.getElementById('lightboxCredito');
  const btnDescargar = document.getElementById('lightboxDescargar');

  // 1) Mostramos al instante la miniatura que ya está cargada (rápida, ya en caché del navegador)
  img.src = f.thumbnailUrl;
  img.classList.add('cargando-hd');

  credito.innerHTML = `Foto: <span>${nombreFotografoActual()}</span> — © Rally Cordobés`;
  btnDescargar.href = f.descargaUrl;
  overlay.classList.add('activo');

  // 2) De fondo, cargamos una versión más nítida (liviana) y la reemplazamos cuando esté lista
  const urlMedia = f.thumbnailUrl.replace('sz=w300', 'sz=w1000');
  const precarga = new Image();
  precarga.onload = () => {
    // solo reemplazamos si seguimos mirando la misma foto (no cerró/cambió mientras cargaba)
    if (overlay.classList.contains('activo') && img.dataset.targetUrl === urlMedia) {
      img.src = urlMedia;
      img.classList.remove('cargando-hd');
    }
  };
  img.dataset.targetUrl = urlMedia;
  precarga.src = urlMedia;

  actualizarFlechasLightbox();
}

function actualizarFlechasLightbox() {
  const btnAnterior = document.getElementById('btnFlechaAnterior');
  const btnSiguiente = document.getElementById('btnFlechaSiguiente');
  btnAnterior.disabled = indiceLightboxActual <= 0;
  // el botón siguiente solo se deshabilita si no hay más fotos cargadas Y no hay más páginas para pedir
  btnSiguiente.disabled = (indiceLightboxActual >= fotosGaleria.length - 1) && !paginaActualToken;
}

function anteriorFoto() {
  if (indiceLightboxActual > 0) abrirLightbox(indiceLightboxActual - 1);
}

async function siguienteFoto() {
  if (indiceLightboxActual + 1 < fotosGaleria.length) {
    abrirLightbox(indiceLightboxActual + 1);
    return;
  }
  // ya no hay más fotos cargadas en memoria: si hay más páginas, las traemos y seguimos
  if (paginaActualToken && carpetaGaleriaActualId) {
    const btnSiguiente = document.getElementById('btnFlechaSiguiente');
    btnSiguiente.disabled = true;
    await cargarGaleria(carpetaGaleriaActualId, paginaActualToken);
    if (indiceLightboxActual + 1 < fotosGaleria.length) {
      abrirLightbox(indiceLightboxActual + 1);
    }
  }
}

document.getElementById('btnFlechaAnterior').onclick = (e) => { e.stopPropagation(); anteriorFoto(); };
document.getElementById('btnFlechaSiguiente').onclick = (e) => { e.stopPropagation(); siguienteFoto(); };

// Navegación por teclado (flechas y Escape)
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('activo')) return;
  if (e.key === 'ArrowRight') siguienteFoto();
  else if (e.key === 'ArrowLeft') anteriorFoto();
  else if (e.key === 'Escape') cerrarLightbox();
});

// Navegación por swipe (celular)
let swipeStartX = null;
const lightboxEl = document.getElementById('lightbox');
lightboxEl.addEventListener('touchstart', (e) => {
  swipeStartX = e.touches[0].clientX;
}, { passive: true });
lightboxEl.addEventListener('touchend', (e) => {
  if (swipeStartX === null) return;
  const deltaX = e.changedTouches[0].clientX - swipeStartX;
  const UMBRAL = 45; // píxeles mínimos para considerarlo un swipe intencional
  if (Math.abs(deltaX) > UMBRAL) {
    if (deltaX < 0) siguienteFoto();
    else anteriorFoto();
  }
  swipeStartX = null;
}, { passive: true });

function cerrarLightbox() {
  const img = document.getElementById('lightboxImg');
  document.getElementById('lightbox').classList.remove('activo');
  img.src = '';
  img.classList.remove('cargando-hd');
  img.dataset.targetUrl = '';
  indiceLightboxActual = -1;
}

document.getElementById('btnCerrarLightbox').onclick = cerrarLightbox;
document.getElementById('lightbox').addEventListener('click', (e) => {
  // cerrar si se clickea el fondo oscuro, no la imagen ni los botones
  if (e.target.id === 'lightbox') cerrarLightbox();
});

// ======= BOTÓN VOLVER =======
function goBack() {
  if (pila.length <= 1) return;
  pila.pop();
  renderBreadcrumb();
  cargarNivel(pila[pila.length - 1].id);
}
document.getElementById('btnVolver').onclick = goBack;
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const btnVolver = document.getElementById('btnVolver');
  btnVolver.classList.toggle('oculto', pila.length <= 1);

  bc.innerHTML = '';
  pila.forEach((nivel, i) => {
    const span = document.createElement('span');
    span.className = 'crumb';
    span.textContent = nivel.nombre;
    span.onclick = () => {
      pila = pila.slice(0, i + 1);
      renderBreadcrumb();
      cargarNivel(nivel.id);
    };
    bc.appendChild(span);
    if (i < pila.length - 1) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '›';
      bc.appendChild(sep);
    }
  });
}

// ======= INICIO =======
renderBreadcrumb();
cargarNivel(ROOT_FOLDER_ID);
</script>
